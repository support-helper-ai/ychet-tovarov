<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учет & Касса</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Пример интерфейса Helper AI -->
    <div class="chat-container">
        <div class="chat-header">✨ Helper AI</div>
        
        <div class="chat-body" id="chatBody">
            <div class="message bot">
                👋 Привет, босс! Я Helper AI.<br>Попробуй спросить:
                <div class="quick-actions">
                    <!-- Быстрая кнопка отправляет ровно строку "Добавить товар" -->
                    <button onclick="sendQuickPrompt(HelperAI.prompts.ADD_PRODUCT)">+ Добавить товар</button>
                    <button onclick="sendQuickPrompt(HelperAI.prompts.COUNT_SHIFT)">📊 Считать смену</button>
                </div>
            </div>
        </div>

        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="Напишите Helper AI...">
            <button id="sendBtn">➤</button>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ МОДУЛЕЙ ССРИПТОВ -->
    <script src="js/store.js"></script>
    <script src="js/helper-ai.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
